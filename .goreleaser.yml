version: 2

before:
  hooks:
    - make check-openapi-provenance generate
    - git diff --exit-code

builds:
  - main: ./cmd/life-ustc
    binary: life-ustc
    ldflags:
      - -s -w -X github.com/Life-USTC/CLI/internal/cmd/root.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
